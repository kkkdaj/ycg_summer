<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>내 시간표</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      background-color: #ffffff;
      background-image: url("data:image/svg+xml;charset=utf-8,<svg xmlns='http://www.w3.org/2000/svg' width='500' height='500' opacity='0.2'><circle cx='70' cy='100' r='18' fill='%235DC05C' stroke='%231A1A1A' stroke-width='2'/><circle cx='380' cy='360' r='18' fill='%235DC05C' stroke='%231A1A1A' stroke-width='2'/><polygon points='280,38 306,80 254,80' fill='%23F25C5C' stroke='%231A1A1A' stroke-width='2'/><polygon points='100,288 126,330 74,330' fill='%23F25C5C' stroke='%231A1A1A' stroke-width='2'/><polygon points='420,138 442,160 420,182 398,160' fill='%23F5C842' stroke='%231A1A1A' stroke-width='2'/><polygon points='200,398 222,420 200,442 178,420' fill='%23F5C842' stroke='%231A1A1A' stroke-width='2'/></svg>");
      background-size: 500px 500px;
      min-height: 100vh;
      padding-bottom: 40px;
    }
    header {
      background: #FFD94A;
      color: #1A1A1A;
      padding: 18px 20px 16px;
      text-align: center;
      border-bottom: 3px solid #1A1A1A;
      position: relative;
      overflow: hidden;
    }
    header::before {
      content: '★ ☆ ★ ☆ ★ ☆ ★ ☆ ★ ☆ ★ ☆ ★ ☆ ★ ☆ ★ ☆ ★ ☆';
      position: absolute;
      bottom: 4px;
      left: 0; right: 0;
      font-size: 9px;
      color: rgba(0,0,0,0.15);
      letter-spacing: 2px;
      white-space: nowrap;
      overflow: hidden;
    }
    header h1 { font-size: 18px; font-weight: 900; margin-bottom: 8px; }
    .user-row { display: flex; justify-content: center; align-items: center; gap: 8px; }
    .badge {
      background: rgba(0,0,0,0.12);
      padding: 4px 14px; border-radius: 20px;
      font-size: 13px; font-weight: 700;
    }
    .back-btn {
      background: rgba(0,0,0,0.08); border: 1px solid rgba(0,0,0,0.2); color: #1A1A1A;
      padding: 4px 14px; border-radius: 20px; font-size: 13px;
      cursor: pointer; font-family: inherit; font-weight: 600;
    }

    .content { max-width: 480px; margin: 0 auto; padding: 24px 16px; }

    .event-header {
      text-align: center;
      margin-bottom: 28px;
    }
    .event-header .date {
      font-size: 13px;
      color: #999;
      margin-bottom: 6px;
    }
    .event-header h2 {
      font-size: 20px;
      font-weight: 800;
      color: #222;
    }

    /* 시간표 표 */
    .timetable {
      width: 100%;
      border-collapse: collapse;
      background: white;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 16px rgba(102, 126, 234, 0.12);
    }
    .timetable thead tr {
      background: #FFD94A;
      color: #1A1A1A;
      border-bottom: 2px solid #1A1A1A;
    }
    .timetable th {
      padding: 14px 16px;
      font-size: 13px;
      font-weight: 900;
      text-align: center;
    }
    .timetable td {
      padding: 20px 16px;
      text-align: center;
      border-bottom: 1px solid #f0f0f0;
      vertical-align: middle;
    }
    .timetable tr:last-child td { border-bottom: none; }
    .timetable tr:hover td { background: #fafbff; }

    .td-period { font-size: 14px; font-weight: 800; color: #FF4444; white-space: nowrap; }
    .td-time   { font-size: 13px; color: #555; font-weight: 600; white-space: nowrap; }
    .td-lec-name { font-size: 17px; font-weight: 800; color: #222; }
    .td-lec-name.empty { font-size: 14px; color: #ccc; font-weight: 500; }
    .td-room { font-size: 14px; color: #555; font-weight: 600; }

    /* 미완료 안내 */
    .incomplete-notice {
      background: #fff7ed;
      border: 2px solid #fed7aa;
      border-radius: 12px;
      padding: 14px 16px;
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
      color: #c2410c;
    }

    /* 하단 버튼 */
    .actions { margin-top: 28px; display: flex; flex-direction: column; gap: 10px; }
    .btn {
      width: 100%; padding: 15px;
      border-radius: 12px; font-size: 15px;
      font-weight: 700; cursor: pointer;
      border: none; font-family: inherit;
      transition: opacity 0.2s;
      letter-spacing: -0.3px;
    }
    .btn-primary {
      background: #FF4444;
      color: white;
      border: 2px solid #1A1A1A;
    }
    .btn-outline {
      background: #FFD94A; color: #1A1A1A;
      border: 2px solid #1A1A1A;
    }
    .btn:hover { opacity: 0.88; }

    /* 로딩 */
    .loading {
      text-align: center;
      padding: 60px 0;
      color: #aaa;
      font-size: 15px;
    }
    .btn-primary:disabled { background: #ddd; color: #999; border-color: #ddd; cursor: default; font-size: 13px; }
    .btn-primary:disabled:hover { opacity: 1; }
  </style>
</head>
<body>
  <header>
    <h1>📋 내 시간표</h1>
    <div class="user-row">
      <span class="badge" id="user-display"></span>
      <button class="back-btn" onclick="goBack()">나가기</button>
    </div>
  </header>

  <div class="content">
    <div class="event-header">
      <div class="date">2026 잠실교회 청년1부 여름수련회</div>
      <h2>클래스 시간표</h2>
    </div>

    <div id="loading" class="loading">불러오는 중...</div>

    <div id="main" style="display:none">
      <table class="timetable">
        <thead>
          <tr>
            <th>교시</th>
            <th>시간</th>
            <th>강의</th>
            <th>장소</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td><div class="td-period">1교시</div></td>
            <td><div class="td-time">16:50 ~ 17:30</div></td>
            <td><div class="td-lec-name" id="lec1">-</div></td>
            <td><div class="td-room" id="room1"></div></td>
          </tr>
          <tr>
            <td><div class="td-period">2교시</div></td>
            <td><div class="td-time">17:40 ~ 18:20</div></td>
            <td><div class="td-lec-name" id="lec2">-</div></td>
            <td><div class="td-room" id="room2"></div></td>
          </tr>
        </tbody>
      </table>

      <div class="incomplete-notice" id="notice" style="display:none">
        아직 신청하지 않은 교시가 있어요.<br>수강신청 화면에서 신청을 완료해주세요!
      </div>

      <div class="actions">
        <button class="btn btn-primary" id="register-btn" onclick="goRegister()">수강신청 하러 가기</button>
        <button class="btn btn-outline" onclick="goBack()">처음으로</button>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script>
    const grade  = sessionStorage.getItem('grade');
    const name   = sessionStorage.getItem('name');
    const userId = sessionStorage.getItem('userId');
    if (!grade || !name) window.location.href = 'index.html';

    document.getElementById('user-display').textContent = grade + ' ' + name;

    firebase.initializeApp({
      apiKey: "AIzaSyC6fE8kSwj3WirTs3d2Ddh_QZHaaNiEe80",
      authDomain: "ycg-summer-retreat.firebaseapp.com",
      projectId: "ycg-summer-retreat",
      storageBucket: "ycg-summer-retreat.firebasestorage.app",
      messagingSenderId: "900312562490",
      appId: "1:900312562490:web:febf7db7ce182d61402e03"
    });
    const db = firebase.firestore();

    const ICONS = {
      '모델링팩': '🧸',
      '레고 피규어 만들기': '🏐',
      '도미노': '🁣',
      '전지 그림': '🎨',
      '슬라임': '🟢',
      '덤벼라 중성마녀': '🧘',
      '과자집 만들기': '🍪'
    };

    const ROOMS = {
      '모델링팩': '101호',
      '레고 피규어 만들기': '102호',
      '도미노': '탁구대, 당구대',
      '전지 그림': '104호',
      '슬라임': '105호',
      '덤벼라 중성마녀': '예배당',
      '과자집 만들기': '107호'
    };

    function goBack() { sessionStorage.clear(); window.location.href = 'index.html'; }

    async function goRegister() {
      try {
        const doc = await db.collection('meta').doc('settings').get();
        const isOpen = doc.exists ? doc.data().isOpen !== false : true;
        if (!isOpen) {
          document.getElementById('reg-closed-msg').style.display = 'block';
          return;
        }
      } catch (e) { console.error(e); }
      window.location.href = 'student.html';
    }

    async function load() {
      try {
        const doc = await db.collection('registrations').doc(userId).get();

        const lec1El = document.getElementById('lec1');
        const lec2El = document.getElementById('lec2');

        if (doc.exists) {
          const d = doc.data();

          if (d.period1) {
            lec1El.textContent = d.period1;
            lec1El.className   = 'td-lec-name';
            document.getElementById('room1').textContent = ROOMS[d.period1] || '';
          } else {
            lec1El.textContent = '미신청';
            lec1El.className   = 'td-lec-name empty';
          }

          if (d.period2) {
            lec2El.textContent = d.period2;
            lec2El.className   = 'td-lec-name';
            document.getElementById('room2').textContent = ROOMS[d.period2] || '';
          } else {
            lec2El.textContent = '미신청';
            lec2El.className   = 'td-lec-name empty';
          }

          if (!d.period1 || !d.period2) {
            document.getElementById('notice').style.display = 'block';
          }
        } else {
          lec1El.textContent = '미신청'; lec1El.className = 'td-lec-name empty';
          lec2El.textContent = '미신청'; lec2El.className = 'td-lec-name empty';
          document.getElementById('notice').style.display = 'block';
        }
      } catch (e) {
        console.error(e);
      } finally {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('main').style.display = 'block';
      }
    }

    db.collection('meta').doc('settings').onSnapshot(doc => {
      const isOpen = doc.exists ? doc.data().isOpen !== false : true;
      const btn = document.getElementById('register-btn');
      btn.textContent = isOpen ? '수강신청 하러 가기' : '지금은 수강신청 시간이 아닙니다.';
      btn.disabled = !isOpen;
    });

    load();
  </script>
</body>
</html>
